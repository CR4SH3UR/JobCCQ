name: Déploiement du site sur GitHub Pages

# Construit le site statique JobCCQ (l'API n'est pas requise : la logique de
# filtrage tourne dans le navigateur à partir d'un instantané jobs.json) puis
# le publie sur la branche `gh-pages`.
#
# GitHub n'autorise pas le jeton des Actions à *activer* Pages tout seul ; cette
# approche par branche évite ce blocage. Le site sera servi sur
# https://<utilisateur>.github.io/<repo>/ dès que Pages est activé.
# Si ce n'est pas déjà fait : Settings → Pages → Source :
#   « Deploy from a branch » → branche « gh-pages » / dossier « / (root) ».

on:
  push:
    branches: [main, claude/job-offers-aggregator-ehf65z]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Un instantané réel est versionné dans le dépôt ; on ne le régénère
      # (depuis les données de démo) que s'il est absent, pour ne pas écraser
      # les vraies offres publiées.
      - name: Générer l'instantané des offres (jobs.json) si absent
        run: test -f apps/web/public/data/jobs.json || npm run export:static -w @jobccq/api

      - name: Construire le site (export statique)
        env:
          BUILD_STATIC: "1"
          NEXT_PUBLIC_STATIC_DATA: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build -w @jobccq/web

      - name: Publier sur la branche gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/web/out
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Déploiement du site — ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
