name: Déploiement du site sur GitHub Pages

# Construit le site statique JobCCQ (l'API n'est pas requise : la logique de
# filtrage tourne dans le navigateur à partir d'un instantané jobs.json) puis
# le publie sur la branche `gh-pages`.
#
# GitHub n'autorise pas le jeton des Actions à *activer* Pages tout seul ; cette
# approche par branche évite ce blocage. Le site sera servi sur
# https://<utilisateur>.github.io/<repo>/ dès que Pages est activé.
# Si ce n'est pas déjà fait : Settings → Pages → Source :
#   « Deploy from a branch » → branche « gh-pages » / dossier « / (root) ».

on:
  push:
    branches: [main, claude/job-offers-aggregator-ehf65z]
  # Redéploie automatiquement à la fin d'un scrape : le push de jobs.json fait
  # par le workflow « Scraper les offres » (jeton d'Actions) ne déclenche PAS
  # l'événement `push` ci-dessus (garde-fou anti-boucle de GitHub), donc sans
  # ceci le site ne se reconstruirait jamais après le scrape hebdomadaire.
  workflow_run:
    workflows: ["Scraper les offres"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Sur un scrape terminé, ne déploie que s'il a réussi. Les autres
    # déclencheurs (push sur main, lancement manuel) déploient toujours.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    env:
      # Si Turso est configuré (secrets présents), le site se construit à partir
      # de la base ; sinon, à partir des fichiers versionnés. Voir infra/README-turso.md.
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Turso = source de vérité : on régénère discovered.json + jobs.json depuis
      # la base avant le build (éphémère en CI, non committé). Le site reste
      # statique et aucun jeton n'est exposé au navigateur.
      - name: Rafraîchir les données depuis Turso (si configuré)
        if: env.TURSO_DATABASE_URL != ''
        run: |
          npm run prisma:generate -w @jobccq/api
          npm run sync:employers -w @jobccq/api
          npm run export:employers -w @jobccq/api
          npm run export:static -w @jobccq/api -- --from-db

      # Sans Turso : un instantané réel est versionné ; on ne le régénère (depuis
      # les données de démo) que s'il est absent, pour ne pas écraser les offres.
      - name: Générer l'instantané des offres (jobs.json) si absent
        run: test -f apps/web/public/data/jobs.json || npm run export:static -w @jobccq/api

      # Shards par région + manifeste (idée 120) : le client ne retélécharge
      # que les régions changées. Pas de BD requise — découpe jobs.json.
      - name: Découper l'instantané par région
        run: npm run split:jobs -w @jobccq/api

      - name: Construire le site (export statique)
        env:
          BUILD_STATIC: "1"
          NEXT_PUBLIC_STATIC_DATA: "1"
          # Domaine personnalisé (jobccqc.ca) : le site est servi à la RACINE,
          # donc pas de basePath. L'origine sert aux URL absolues (canoniques,
          # sitemap, JSON-LD). Le fichier apps/web/public/CNAME configure Pages.
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://jobccqc.ca
          # Comptes + favoris synchronisés (Supabase). Clés publiques « anon » :
          # sûres à intégrer au bundle (la sécurité vient des règles RLL/RLS).
          # Vides si non définies → l'app retombe sur les favoris locaux.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Liste blanche des administrateurs (courriels séparés par des virgules).
          # Restreint /admin aux comptes indiqués ; vide → console verrouillée.
          NEXT_PUBLIC_ADMIN_EMAILS: ${{ vars.NEXT_PUBLIC_ADMIN_EMAILS }}
          # Sentry navigateur (idée 112). Vide = désactivé.
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
        run: npm run build -w @jobccq/web

      - name: Publier sur la branche gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/web/out
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Déploiement du site — ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
