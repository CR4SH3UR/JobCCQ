name: Scraper les offres

# Deux déclenchements :
#  - manuel (onglet Actions ou console admin) : un employeur, une liste
#    `id1,id2,id3` (un seul run), ou tous (champ vide) ;
#  - planifié (2×/semaine, lundi + jeudi) : re-scrape tous les sites pour
#    garder l'instantané frais (évite les offres périmées / manquantes).
#
# Dans tous les cas on repart de l'instantané en ligne (jobs.json), puis le
# scraping se fait en mode « sync » : il retire les postes comblés MAIS ne
# détruit jamais les offres d'un site qui échoue ou renvoie vide (ex. Jobillico
# renvoie 403 depuis les IP de GitHub Actions → le site garde ses offres).

on:
  workflow_dispatch:
    inputs:
      sourceId:
        description: "id(s) à scraper, séparés par des virgules (vide = tous). Ex. patrickmorin-com ou a,b,c"
        required: false
        default: ""
      maxPages:
        description: "Pages max par site"
        required: false
        default: "2"
      force:
        description: "Remplacement forcé (ignore l'anti-purge) : id(s) à écraser, ou 'true' pour la source ciblée. Ex. balvent-com. Vide = jamais. À utiliser pour un employeur mal configuré."
        required: false
        default: ""
  schedule:
    # Lundi et jeudi à 08:00 UTC (~3–4 h du matin, heure du Québec).
    - cron: "0 8 * * 1,4"

permissions:
  contents: write

# Concurrence **par source** : un scrape ciblé (ex. « atlasmaconnerie-com ») ne
# fait plus la file derrière un autre scrape d'une AUTRE source (ni derrière le
# scrape complet hebdomadaire, qui peut durer ~1 h) — il démarre tout de suite.
# Seuls deux scrapes du MÊME id (ou deux scrapes complets) sont sérialisés, pour
# éviter qu'ils se marchent dessus sur les mêmes lignes. La base Turso, elle, est
# écrite en temps réel au fil du scraping (source par source).
#
# Cas d'une LISTE d'ids (« a,b,c ») : on utilise un groupe fixe « scrape-batch »
# plutôt que d'inclure toute la liste — un nom de groupe trop long (>255 car.)
# fait échouer le run au démarrage (0 job). Les scrapes par lot se sérialisent
# donc entre eux, ce qui est sans risque (écriture Turso par source, mode sync).
concurrency:
  group: scrape-${{ contains(github.event.inputs.sourceId, ',') && 'batch' || (github.event.inputs.sourceId || 'all') }}
  cancel-in-progress: false
  queue: max

env:
  DATABASE_URL: file:./prisma/dev.db
  # Proxy sortant optionnel (contourne le 403 de Jobillico depuis les IP de CI).
  # Vides si les secrets ne sont pas définis → aucun proxy (voir infra/README-proxy.md).
  SCRAPE_PROXY_URL: ${{ secrets.SCRAPE_PROXY_URL }}
  SCRAPE_PROXY_TOKEN: ${{ secrets.SCRAPE_PROXY_TOKEN }}
  # Base Turso optionnelle. Vides → fichier SQLite local (voir infra/README-turso.md).
  TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Préparer la base
        run: npm run setup -w @jobccq/api

      # Repli fichier (SQLite éphémère) : on repeuple la base avec l'instantané
      # pour que les sites non re-scrapés conservent leurs offres à l'export.
      # Inutile avec Turso, qui **persiste** entre les exécutions (et l'import
      # ligne-par-ligne sur le réseau serait lent) → on saute l'étape.
      - name: Importer l'instantané (repli fichier)
        if: env.TURSO_DATABASE_URL == ''
        run: npm run import:snapshot -w @jobccq/api

      # Config employeurs = Turso (source de vérité). On régénère discovered.json
      # depuis la base AVANT de scraper : sinon un employeur dont on vient de
      # corriger l'URL / la méthode dans la console d'admin serait re-scrapé avec
      # son ANCIENNE config, car le registre lit le fichier committé et non Turso.
      # (Fichier éphémère en CI, non committé — comme au déploiement.)
      - name: Rafraîchir la config employeurs depuis Turso (si configuré)
        if: env.TURSO_DATABASE_URL != ''
        run: npm run export:employers -w @jobccq/api

      # Scraping en mode « sync » (retire les postes comblés, jamais sur échec).
      # sourceId vide (planifié ou champ vide) = tous les sites.
      - name: Scraper
        env:
          SID: ${{ github.event.inputs.sourceId }}
          MP: ${{ github.event.inputs.maxPages || '2' }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ -n "$SID" ]; then
            echo "Scraping ciblé : $SID (maxPages=$MP, force='$FORCE')"
            SCRAPE_IDS="$SID" SCRAPE_MAX_PAGES="$MP" SCRAPE_FORCE="$FORCE" npm run scrape -w @jobccq/api
          else
            echo "Scraping de toutes les sources (maxPages=$MP, force='$FORCE')"
            SCRAPE_MAX_PAGES="$MP" SCRAPE_FORCE="$FORCE" npm run scrape -w @jobccq/api
          fi

      # Avec Turso : RIEN à committer. La base est déjà à jour (écriture temps
      # réel pendant le scrape) et le site se reconstruit **depuis Turso** au
      # déploiement automatique (déclencheur `workflow_run` en fin de scrape).
      # Ne rien pousser évite aussi que deux scrapes en parallèle se battent sur
      # `main` (push rejeté) — c'est ce qui permet de lancer un scrape sans
      # attendre les autres.
      #
      # Sans Turso (repli fichier) : jobs.json versionné = source de vérité, donc
      # on l'exporte et on le committe comme avant.
      - name: Exporter et committer l'instantané (repli fichier)
        if: env.TURSO_DATABASE_URL == ''
        run: |
          npm run export:static -w @jobccq/api -- --from-db
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/data/jobs.json
          if git diff --cached --quiet; then
            echo "Aucun changement d'offres."
          else
            git commit -m "Scraping : ${{ github.event.inputs.sourceId || 'toutes les sources (planifié)' }}"
            git push origin HEAD:main
          fi
