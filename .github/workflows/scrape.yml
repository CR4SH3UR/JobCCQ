name: Scraper les offres

# Deux déclenchements :
#  - manuel (onglet Actions → « Scraper les offres » → « Run workflow ») : un
#    employeur précis (champ « sourceId ») ou tous (champ vide) ;
#  - planifié (cron hebdomadaire) : re-scrape tous les sites pour garder
#    l'instantané frais (évite les offres périmées / manquantes).
#
# Dans tous les cas on repart de l'instantané en ligne (jobs.json), puis le
# scraping se fait en mode « sync » : il retire les postes comblés MAIS ne
# détruit jamais les offres d'un site qui échoue ou renvoie vide (ex. Jobillico
# renvoie 403 depuis les IP de GitHub Actions → le site garde ses offres).

on:
  workflow_dispatch:
    inputs:
      sourceId:
        description: "id de l'employeur à scraper (vide = tous les sites). Ex. patrickmorin-com"
        required: false
        default: ""
      maxPages:
        description: "Pages max par site"
        required: false
        default: "2"
  schedule:
    # Tous les lundis à 08:00 UTC (~3–4 h du matin, heure du Québec).
    - cron: "0 8 * * 1"

permissions:
  contents: write

concurrency:
  group: scrape-jobs
  cancel-in-progress: false

env:
  DATABASE_URL: file:./prisma/dev.db
  # Proxy sortant optionnel (contourne le 403 de Jobillico depuis les IP de CI).
  # Vides si les secrets ne sont pas définis → aucun proxy (voir infra/README-proxy.md).
  SCRAPE_PROXY_URL: ${{ secrets.SCRAPE_PROXY_URL }}
  SCRAPE_PROXY_TOKEN: ${{ secrets.SCRAPE_PROXY_TOKEN }}
  # Base Turso optionnelle. Vides → fichier SQLite local (voir infra/README-turso.md).
  TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Préparer la base
        run: npm run setup -w @jobccq/api

      # Repli fichier (SQLite éphémère) : on repeuple la base avec l'instantané
      # pour que les sites non re-scrapés conservent leurs offres à l'export.
      # Inutile avec Turso, qui **persiste** entre les exécutions (et l'import
      # ligne-par-ligne sur le réseau serait lent) → on saute l'étape.
      - name: Importer l'instantané (repli fichier)
        if: env.TURSO_DATABASE_URL == ''
        run: npm run import:snapshot -w @jobccq/api

      # Config employeurs = Turso (source de vérité). On régénère discovered.json
      # depuis la base AVANT de scraper : sinon un employeur dont on vient de
      # corriger l'URL / la méthode dans la console d'admin serait re-scrapé avec
      # son ANCIENNE config, car le registre lit le fichier committé et non Turso.
      # (Fichier éphémère en CI, non committé — comme au déploiement.)
      - name: Rafraîchir la config employeurs depuis Turso (si configuré)
        if: env.TURSO_DATABASE_URL != ''
        run: npm run export:employers -w @jobccq/api

      # Scraping en mode « sync » (retire les postes comblés, jamais sur échec).
      # sourceId vide (planifié ou champ vide) = tous les sites.
      - name: Scraper
        env:
          SID: ${{ github.event.inputs.sourceId }}
          MP: ${{ github.event.inputs.maxPages || '2' }}
        run: |
          if [ -n "$SID" ]; then
            echo "Scraping ciblé : $SID (maxPages=$MP)"
            SCRAPE_IDS="$SID" SCRAPE_MAX_PAGES="$MP" npm run scrape -w @jobccq/api
          else
            echo "Scraping de toutes les sources (maxPages=$MP)"
            SCRAPE_MAX_PAGES="$MP" npm run scrape -w @jobccq/api
          fi

      - name: Exporter l'instantané
        run: npm run export:static -w @jobccq/api -- --from-db

      - name: Committer et pousser
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/data/jobs.json
          if git diff --cached --quiet; then
            echo "Aucun changement d'offres."
          else
            git commit -m "Scraping : ${{ github.event.inputs.sourceId || 'toutes les sources (planifié)' }}"
            git push origin HEAD:main
          fi
