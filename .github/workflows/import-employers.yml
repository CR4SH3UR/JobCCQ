name: Importer des employeurs (Turso)

# Import **incrémental** d'employeurs dans Turso à partir du fichier
# apps/api/data/jobillico-employers.json (upsert ciblé, sans toucher aux offres).
# Additif/correctif uniquement — voir apps/api/src/import-employers.ts.
# Lancement manuel (onglet Actions → « Importer des employeurs » → Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-employers
  cancel-in-progress: false
  queue: max

env:
  DATABASE_URL: file:./prisma/dev.db
  TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npm run prisma:generate -w @jobccq/api

      - name: Importer les employeurs dans Turso
        run: npm run import:employers -w @jobccq/api
