name: Notifier les alertes emploi

# Envoie les courriels d'alerte et les push Expo (offres correspondant aux
# recherches sauvegardées / jetons) APRÈS chaque scraping réussi. Déclenchable
# aussi à la main.
#
# Ne fait rien tant que Supabase + Resend ne sont pas configurés (le script sort
# proprement). Voir infra/README-supabase.md.

on:
  workflow_run:
    workflows: ["Scraper les offres"]
    types: [completed]
  workflow_dispatch:

# Un seul envoi à la fois (évite les doublons si deux scrapes se terminent).
concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    # Sur déclenchement par le scraping, on n'envoie que s'il a réussi.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      DATABASE_URL: file:./prisma/dev.db
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # Supabase (clé service_role = SECRET, jamais exposée au navigateur).
      SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Resend + expéditeur vérifié.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFY_FROM: ${{ vars.NOTIFY_FROM }}
      NOTIFY_SITE_URL: https://cr4sh3ur.github.io/JobCCQ
      WEBHOOK_SCRAPE_URL: ${{ secrets.WEBHOOK_SCRAPE_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npm run prisma:generate -w @jobccq/api

      - name: Envoyer les alertes
        run: npm run notify -w @jobccq/api
