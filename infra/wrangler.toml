# Config Wrangler pour déployer le proxy JobCCQ (Cloudflare Worker).
#
#   cd infra
#   npx wrangler login
#   npx wrangler secret put PROXY_TOKEN      # colle ton jeton (garde-le)
#   npx wrangler deploy
#
# Après le deploy, Wrangler affiche l'URL publique (https://jobccq-proxy.<compte>.workers.dev)
# à mettre dans le secret GitHub SCRAPE_PROXY_URL (et le même jeton dans SCRAPE_PROXY_TOKEN).

name = "jobccq-proxy"
main = "jobillico-proxy-worker.js"
compatibility_date = "2025-01-01"

# Hôtes autorisés par le proxy (anti relais ouvert). Modifiable sans toucher au
# code. « * » = tout hôte — sûr ici car le jeton PROXY_TOKEN reste OBLIGATOIRE
# (ce n'est pas un relais ouvert), et ça permet au repli automatique du scraper
# de rattraper n'importe quel site qui bloque les IP de CI. Pour restreindre :
# ALLOW_HOSTS = "jobillico.com,desfor.com,alarme-bois-francs.com".
#
# ⚠️ ALLOW_HOSTS est une VARIABLE (pas un secret). Ne fais donc PAS
# `wrangler secret put ALLOW_HOSTS` (erreur « Binding name already in use ») :
# change la valeur ici puis `npx wrangler deploy`, ou en une commande :
#   npx wrangler deploy --var ALLOW_HOSTS:"*"
[vars]
ALLOW_HOSTS = "*"

# Le jeton PROXY_TOKEN n'est PAS ici (c'est un secret) : `wrangler secret put PROXY_TOKEN`.
